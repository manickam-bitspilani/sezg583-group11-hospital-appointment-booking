# patient-service: patients and their no-show count (BR12).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
  namespace: hospital-booking
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false  # no Kubernetes API access needed
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001  # the images' app user (USER app is not numeric)
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U postgres; do sleep 2; done"]
          securityContext:
            runAsUser: 70  # the image's postgres user
      containers:
        - name: patient-service
          image: hospital-booking/patient-service:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8002
          envFrom:
            - configMapRef:
                name: app-config
          env:
            - name: DB_NAME
              value: patient_db
            - name: DB_USER
              value: patient_svc
            - name: DB_PASSWORD_FILE
              value: /run/secrets/patient_db_password
          volumeMounts:
            - name: db-password
              mountPath: /run/secrets
              readOnly: true
          # Ready only when its database answers (/health returns 503 otherwise);
          # liveness only checks the process, so a database outage does not
          # make Kubernetes restart every pod.
          readinessProbe:
            httpGet: {path: /health, port: 8002}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: {port: 8002}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: db-password
          secret:
            secretName: db-passwords
            items:
              - key: patient_db_password
                path: patient_db_password
---
apiVersion: v1
kind: Service
metadata:
  name: patient-service
  namespace: hospital-booking
spec:
  selector:
    app: patient-service
  ports:
    - port: 8002
